# Security scanning for the public 4pm-cli repo (ADR-0617):
#   - secrets: gitleaks over the full git history — BLOCKING (default ruleset)
#   - codeql:  JavaScript/TypeScript SAST, uploaded to Code scanning (free on a public repo)
# The monorepo's security.yml also scans the commit it pins as a submodule.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1" # weekly, so new advisories surface without a code change

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
